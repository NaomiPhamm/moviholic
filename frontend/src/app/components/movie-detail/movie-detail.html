<div *ngIf="movie" class="detail-page">

  <button class="back-btn" routerLink="/movies">
    ← Back to Movies
  </button>

  <div class="detail-layout">

    <!-- Poster -->
    <div>
      <img
        *ngIf="movie.posterUrl"
        [src]="movie.posterUrl"
        alt="{{ movie.title }}"
        class="poster"
      />
    </div>

    <!-- Movie Info -->
    <div class="movie-info">

      <h2>{{ movie.title }}</h2>

      <p><strong>Genre:</strong> {{ movie.genre }}</p>
      <p><strong>Year:</strong> {{ movie.releaseYear }}</p>
      <p><strong>Director:</strong> {{ movie.director }}</p>
      <p><strong>Rating:</strong> ⭐ {{ movie.averageRating }}</p>

      <p class="description">
        {{ movie.description }}
      </p>

    </div>

    <!-- Reviews -->
    <div class="review-panel">

      <h3>Reviews</h3>

      <div *ngIf="reviews.length === 0">
        No reviews yet.
      </div>

      <div class="review-card" *ngFor="let review of reviews">
        <strong>{{ review.user.username }}</strong>
        <p>⭐ {{ review.rating }}</p>
        <p>{{ review.comment }}</p>
      </div>

      <h3>Add Review</h3>

      <label>Rating (1–5)</label>
      <input type="number" min="1" max="5" [(ngModel)]="newRating" />

      <label>Comment</label>
      <textarea rows="4" [(ngModel)]="newComment"></textarea>

      <button (click)="submitReview()">Submit Review</button>

    </div>

  </div>

</div>

<div class="profile-page">

  <div class="profile-card" *ngIf="user">
    <h2>User Profile</h2>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
  </div>

  <section class="profile-section">
    <h3>My Reviews</h3>

    <div *ngIf="reviews.length === 0" class="empty-text">
      No reviews yet.
    </div>

    <div class="card-grid">
      <div class="review-card" *ngFor="let review of reviews.slice(0, visibleReviewCount)">
        <a [routerLink]="['/reviews', review._id]">
          <strong>{{ review.movie.title }}</strong>
        </a>

        <p>⭐ {{ review.rating }}</p>
        <p>{{ review.comment }}</p>
      </div>
    </div>

    <button *ngIf="visibleReviewCount < reviews.length" (click)="seeMoreReviews()">
      See More Reviews
    </button>
  </section>

  <section class="profile-section">
    <h3>My Movies</h3>

    <div *ngIf="myMovies.length === 0" class="empty-text">
      No movies added yet.
    </div>

    <div class="card-grid">
      <div class="movie-card" *ngFor="let movie of myMovies.slice(0, visibleMovieCount)">
        <img *ngIf="movie.posterUrl" [src]="movie.posterUrl" alt="{{ movie.title }}" />

        <a [routerLink]="['/movies/edit', movie._id]">
          <strong>{{ movie.title }}</strong>
        </a>

        <p>{{ movie.genre }}</p>
        <p>{{ movie.releaseYear }}</p>
        <p>⭐ {{ movie.averageRating }}</p>
      </div>
    </div>

    <button *ngIf="visibleMovieCount < myMovies.length" (click)="seeMoreMovies()">
      See More Movies
    </button>
  </section>

</div>
